basePath: /api/v1
definitions:
  models.Attachment:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      file_path:
        type: string
      id:
        type: integer
      note_id:
        type: integer
    type: object
  models.Note:
    properties:
      attachments:
        items:
          $ref: '#/definitions/models.Attachment'
        type: array
      id:
        type: integer
      status:
        type: boolean
      title:
        type: string
      user_id:
        type: integer
    required:
    - title
    type: object
  models.NoteShare:
    properties:
      created_at:
        type: string
      id:
        type: integer
      note_id:
        type: integer
      owner_id:
        type: integer
      shared_with_user:
        type: integer
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: This is a sample Gin framework server.
  title: Gin Note App API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT
      parameters:
      - description: User Login Details
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User Registration Details
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              $ref: '#/definitions/models.User'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /notes:
    get:
      description: Get all owned and shared notes for the authenticated user
      parameters:
      - description: Search by title
        in: query
        name: search
        type: string
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Pagination page
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all notes
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Add a new note to the user's collection
      parameters:
      - description: Note object
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/models.Note'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Note'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new note
      tags:
      - notes
  /notes/{id}:
    delete:
      description: Remove a note from the user's collection
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a note
      tags:
      - notes
    get:
      description: Fetch a specific note owned by the user
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Note'
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a note by ID
      tags:
      - notes
    put:
      consumes:
      - application/json
      description: Modify a note's title or status
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated note object
        in: body
        name: note
        required: true
        schema:
          $ref: '#/definitions/models.Note'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an existing note
      tags:
      - notes
  /notes/{id}/attachments:
    post:
      consumes:
      - multipart/form-data
      description: Attach a file to a specific note
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              $ref: '#/definitions/models.Attachment'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload an attachment to a note
      tags:
      - notes
  /notes/{id}/share:
    post:
      consumes:
      - application/json
      description: Grant access to a note for another user
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      - description: Target User ID
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Share a note with another user
      tags:
      - shares
  /notes/{id}/share/{uid}:
    delete:
      description: Remove access to a note for another user
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: uid
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Revoke a note share
      tags:
      - shares
  /notes/{id}/shares:
    get:
      description: Get a list of users who have access to the note
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.NoteShare'
              type: array
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all shares for a note
      tags:
      - shares
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
